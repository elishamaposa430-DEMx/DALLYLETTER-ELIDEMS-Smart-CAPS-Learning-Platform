version: "3.9"

services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-20-bookworm
    init: true
    command: sleep infinity
    volumes:
      - ..:/workspaces:cached
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dallyletter
      PORT: 4000
      API_PORT: 4000
      API_BASE_URL: http://localhost:4000
      BASE_PATH: /
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      VITE_API_BASE_URL: http://localhost:4000
      JWT_SECRET: dallyletter-local-secret
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dallyletter
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dallyletter"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
